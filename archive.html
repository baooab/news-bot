<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>历史归档 · 科技资讯</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
<style>
  html, body { background:#f7f8fa; }
  .hero.is-tech {
    background:linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%);
    color:#fff;
  }
  .hero.is-tech .title,
  .hero.is-tech .subtitle { color:#fff !important; }
  .hero.is-tech .has-text-grey-light { color:rgba(255,255,255,.78) !important; }
  .hero.is-tech .has-text-grey { color:rgba(255,255,255,.62) !important; }
  .hero.is-tech a { color:rgba(255,255,255,.85); text-decoration:underline; text-underline-offset:3px; }
  .hero.is-tech a:hover { color:#fff; }
  .toolbar {
    display:flex; flex-wrap:wrap; gap:.75rem; align-items:center;
    margin-bottom:1.75rem;
  }
  .toolbar .field { margin-bottom:0; }
  .year-block { margin-bottom:2.25rem; }
  .year-title {
    display:flex; align-items:baseline; gap:.75rem;
    margin-bottom:1rem; padding-bottom:.6rem;
    border-bottom:2px solid #2c5364;
  }
  .year-title .title { letter-spacing:2px; }
  .month-block {
    margin:0 0 1.25rem; padding:.85rem 0 .85rem 1rem;
    border-left:3px solid #e4e7ea;
  }
  .month-title {
    display:flex; align-items:baseline; gap:.6rem;
    margin-bottom:.7rem;
  }
  .date-list { display:flex; flex-wrap:wrap; gap:.5rem; }
  .date-pill {
    display:inline-flex; align-items:baseline; gap:.35rem;
    padding:.3rem .8rem; border-radius:999px;
    background:#fff; border:1px solid #e6e8ea;
    color:#243b53; font-size:.9rem; line-height:1.5;
    font-variant-numeric:tabular-nums;
    transition:background .18s, color .18s, border-color .18s, transform .18s;
  }
  .date-pill:hover {
    background:#2c5364; border-color:#2c5364; color:#fff; transform:translateY(-1px);
  }
  .date-pill .d { font-weight:600; }
  .date-pill .w { font-size:.72rem; opacity:.6; }
  .footer { background:transparent; }
</style>
</head>
<body>

<section class="hero is-tech">
  <div class="hero-body has-text-centered">
    <p class="title is-2" style="letter-spacing:3px;">历史归档</p>
    <p class="subtitle is-6 mt-3 has-text-grey-light">
      按年份、月份浏览往期科技资讯
    </p>
    <p class="is-size-7 mt-3">
      <a href="index.html">← 返回首页</a>
    </p>
  </div>
</section>

<section class="section">
  <div class="container" style="max-width:820px;">
    <div class="toolbar">
      <div class="field">
        <div class="control">
          <div class="select is-small">
            <select id="yearSelect" aria-label="选择年份">
              <option value="">全部年份</option>
            </select>
          </div>
        </div>
      </div>
      <div class="field is-flex-grow-1" style="min-width:180px;">
        <div class="control">
          <input id="keywordInput" class="input is-small" type="search"
                 placeholder="搜索标题关键词…" autocomplete="off">
        </div>
      </div>
      <p id="resultMeta" class="is-size-7 has-text-grey mb-0"></p>
    </div>

    <div id="loading" class="has-text-centered has-text-grey py-6">
      <p class="mt-2">正在加载归档…</p>
    </div>
    <div id="error" class="notification is-warning is-light" style="display:none;"></div>
    <div id="empty" class="notification is-light" style="display:none;"></div>
    <div id="archive"></div>
  </div>
</section>

<footer class="footer">
  <div class="content has-text-centered has-text-grey is-size-7">
    <p><a href="index.html">返回首页</a> · 数据以 JSON 存储于 <code>data/briefs/</code></p>
  </div>
</footer>

<script>
let allBriefs = [];

const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

function yearKeyOf(date) {
  return (date || '').slice(0, 4);
}

function monthKeyOf(date) {
  return (date || '').slice(0, 7);
}

function yearLabel(key) {
  return `${key}年`;
}

function monthLabel(key) {
  if (!key || key.length < 7) return key;
  return `${Number(key.slice(5, 7))} 月`;
}

function weekdayOf(date) {
  const t = new Date(`${date}T00:00:00`);
  return Number.isNaN(t.getTime()) ? '' : WEEKDAYS[t.getDay()];
}

function qs(name) {
  return new URLSearchParams(location.search).get(name) || '';
}

function groupByYear(briefs) {
  const map = new Map();
  for (const b of briefs) {
    const key = yearKeyOf(b.date);
    if (!key) continue;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(b);
  }
  return [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));
}

function groupByMonth(briefs) {
  const map = new Map();
  for (const b of briefs) {
    const key = monthKeyOf(b.date);
    if (!key) continue;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(b);
  }
  return [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));
}

function renderDatePill(b) {
  const day = (b.date || '').slice(8, 10).replace(/^0/, '');
  const w = weekdayOf(b.date);
  const tip = b.headline ? ` title="${b.headline.replace(/"/g, '&quot;')}"` : '';
  return `<a class="date-pill" href="brief.html?date=${b.date}"${tip}>
    <span class="d">${day} 日</span>${w ? `<span class="w">${w}</span>` : ''}
  </a>`;
}

function applyFilters() {
  const year = document.getElementById('yearSelect').value;
  const keyword = document.getElementById('keywordInput').value.trim().toLowerCase();
  const archive = document.getElementById('archive');
  const emptyBox = document.getElementById('empty');
  const meta = document.getElementById('resultMeta');

  let filtered = allBriefs;
  if (year) filtered = filtered.filter(b => yearKeyOf(b.date) === year);
  if (keyword) {
    filtered = filtered.filter(b => {
      const hay = [b.headline, b.display, b.date, ...(b.sources || [])].join(' ').toLowerCase();
      return hay.includes(keyword);
    });
  }

  meta.textContent = `共 ${filtered.length} 期`;

  if (!filtered.length) {
    archive.innerHTML = '';
    emptyBox.textContent = '没有匹配的简报，请调整年份或关键词。';
    emptyBox.style.display = 'block';
    return;
  }

  emptyBox.style.display = 'none';
  archive.innerHTML = groupByYear(filtered).map(([yKey, yItems]) => `
    <div class="year-block">
      <div class="year-title">
        <h2 class="title is-4 mb-0">${yearLabel(yKey)}</h2>
        <span class="is-size-7 has-text-grey">${yItems.length} 期</span>
      </div>
      ${groupByMonth(yItems).map(([mKey, mItems]) => `
        <div class="month-block">
          <div class="month-title">
            <h3 class="title is-6 mb-0">${monthLabel(mKey)}</h3>
            <span class="is-size-7 has-text-grey">${mItems.length} 期</span>
          </div>
          <div class="date-list">${mItems.map(renderDatePill).join('')}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function fillYearSelect(briefs) {
  const select = document.getElementById('yearSelect');
  const keys = [...new Set(briefs.map(b => yearKeyOf(b.date)).filter(Boolean))]
    .sort((a, b) => b.localeCompare(a));
  select.innerHTML = '<option value="">全部年份</option>' +
    keys.map(k => `<option value="${k}">${yearLabel(k)}</option>`).join('');

  const fromQuery = qs('year');
  if (fromQuery && keys.includes(fromQuery)) select.value = fromQuery;
}

async function load() {
  const loading = document.getElementById('loading');
  const errBox = document.getElementById('error');
  try {
    const resp = await fetch('data/index.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    loading.style.display = 'none';

    allBriefs = data.briefs || [];
    if (!allBriefs.length) {
      document.getElementById('empty').textContent = '暂无简报数据，请先运行 main.py 生成。';
      document.getElementById('empty').style.display = 'block';
      return;
    }

    fillYearSelect(allBriefs);
    applyFilters();

    document.getElementById('yearSelect').addEventListener('change', () => {
      const year = document.getElementById('yearSelect').value;
      const url = new URL(location.href);
      if (year) url.searchParams.set('year', year);
      else url.searchParams.delete('year');
      history.replaceState(null, '', url);
      applyFilters();
    });
    document.getElementById('keywordInput').addEventListener('input', applyFilters);
  } catch (e) {
    loading.style.display = 'none';
    errBox.innerHTML = '加载失败：' + e.message +
      '<br><span class="is-size-7">如为本地打开，请通过 HTTP 服务器访问（file:// 无法读取 JSON）。</span>';
    errBox.style.display = 'block';
  }
}
load();
</script>
</body>
</html>
