name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每日简报 workflow 提交 data 后自动触发部署（避免 bot push 不触发 push 事件）
  workflow_run:
    workflows: ["Daily News Brief"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

# 强制 JS Actions 使用 Node 24（避免 Node 20 弃用告警）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # deploy-pages 需要 OIDC：权限写在 job 级更稳妥
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html archive.html brief.html 404.html .nojekyll _site/
          cp -r data _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 同一 run 重跑时旧 attempt 的 artifact 仍会保留；按 attempt 区分名称避免 deploy-pages 报「找到 2 个」
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
